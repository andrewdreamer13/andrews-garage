<section
  class="hero"
  id="hero"
>
  <picture class="hero__bg">
    <source
      media="(max-width: 900px)"
      srcset="src/assets/img/webp/hero-mob-bg.webp"
      type="image/webp"
    />
    <img
      src="src/assets/img/webp/hero-bg.webp"
      alt="Red Ford Raptor"
      fetchpriority="high"
      loading="eager"
      width="1440"
      height="700"
    />
  </picture>
  <div class="container">
    <div class="hero__inner">
      <h1 class="main-title">
        <span class="main-title__text main-title__text--top"> drive with </span>
        <span
          class="main-title__text main-title__text--bottom"
          translate="no"
        >
          andrew's garage
        </span>
      </h1>
      <div class="hero__info">
        <load
          class="hero__contacts"
          src="/src/html/components/contacts.html"
        />
        <p class="hero__description">
          Your car deserves the best care, and we deliver it with precision,
          speed, and reliability. Book your appointment today!
        </p>
      </div>
      <a
        class="button hero__button"
        href="#booking"
      >
        <span class="button__text">Book Now</span>
      </a>
    </div>
  </div>
</section>
