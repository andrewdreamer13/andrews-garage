<section
  class="booking"
  id="booking"
>
  <div class="container">
    <h2 class="title booking__title">
      <span class="title__text title__text--top">Let’s Get Your Vehicle</span>
      <span class="title__text title__text--bottom">in Top Shape!</span>
    </h2>
    <h3 class="booking__subtitle">
      Ready to give your car the care it deserves? Contact Andrew's Garage for a
      free consultation or to book a service appointment today.
    </h3>
    <load
      class="booking__contacts"
      src="/src/html/components/contacts.html"
    />
    <div class="booking__inner">
       <load
        class="form booking__form"
        src="/src/html/components/form.html"
        id="booking-form"
      />
      <div
        class="map-receiver booking__map-receiver"
        data-map-receiver
        data-map-type="custom"
        data-map-id="ny-garage"
        data-map-lat="40.7831"
        data-map-lng="-73.9547"
          
      ></div>
     
    </div>
  </div>
</section>
