<section
  class="workflow"
  id="workflow"
>
  <div class="container">
    <h2 class="title workflow__title">
      <span class="title__text title__text--top">how to get your</span>
      <span class="title__text title__text--bottom">car fixed fast</span>
    </h2>
    <h3 class="workflow__subtitle">
      Getting back on the road has never been easier. Follow these few simple
      steps to get your car serviced in no time.
    </h3>
    <div class="workflow__inner">
      <div class="workflow__slider swiper">
        <div class="workflow__images swiper-wrapper">
          
          <div class="swiper-slide">
            <img
              class="workflow__img"
              src="/src/assets/img/webp/workflow-1.webp"
              alt="broken-down car on the roadside"
            />
          </div>

          <div class="swiper-slide">
            <img
              class="workflow__img"
              src="/src/assets/img/webp/workflow-2.webp"
              alt="The driver is talking on the phone."
            />
          </div>

          <div class="swiper-slide">
            <img
              class="workflow__img"
              src="/src/assets/img/webp/workflow-3.webp"
              alt="A mechanic is repairing an engine."
            />
          </div>

          <div class="swiper-slide">
            <img
              class="workflow__img"
              src="/src/assets/img/webp/workflow-4.webp"
              alt="The car is driving out of the city."
            />
          </div>
          <div class="swiper-slide swiper-slide-mob">
            <img
              class="workflow__img"
              src="/src/assets/img/webp/workflow-1.webp"
              alt="broken-down car on the roadside"
            />
          </div>

          <div class="swiper-slide swiper-slide-mob">
            <img
              class="workflow__img"
              src="/src/assets/img/webp/workflow-2.webp"
              alt="The driver is talking on the phone."
            />
          </div>

          <div class="swiper-slide swiper-slide-mob">
            <img
              class="workflow__img"
              src="/src/assets/img/webp/workflow-3.webp"
              alt="A mechanic is repairing an engine."
            />
          </div>

          <div class="swiper-slide swiper-slide-mob">
            <img
              class="workflow__img"
              src="/src/assets/img/webp/workflow-4.webp"
              alt="The car is driving out of the city."
            />
          </div>
        </div>
      </div>

      <load
        class="workflow__accordion"
        id="workflow-accordion"
        src="/src/html/components/accordion.html"
      />
    </div>
  </div>
</section>
