<div class="contacts {=$class}">
  <ul class="contacts__list">
    <li class="contacts__item">
      <svg class="contacts__svg">
        <use href="#icons-contacts-map-pin"></use>
      </svg>

      <address class="contacts__address">
        1370 Lexington Ave, New York, NY 10128
      </address>
    </li>
    <li class="contacts__item">
      <svg class="contacts__svg">
        <use href="#icons-contacts-phone"></use>
      </svg>
      <a
        class="contacts__phone"
        href="tel:+17185550184"
        data-text="+1&nbsp;(718)&nbsp;555-0184"
        >+1 (718) 555-0184</a
      >
    </li>
    <li class="contacts__item">
      <svg class="contacts__svg">
        <use href="#icons-contacts-email"></use>
      </svg>
      <a
        class="contacts__email"
        href="mailto:andrewgarage@gmail.com"
        data-text="andrewgarage@gmail.com"
        >andrewgarage@gmail.com</a
      >
    </li>
    <li class="contacts__item">
      <svg class="contacts__svg">
        <use href="#icons-contacts-clock"></use>
      </svg>
      <span class="contacts__hours">Mon – Fri: 8 AM – 8 PM</span>
    </li>
    <li class="contacts__item">
      <svg class="contacts__svg">
        <use href="#icons-contacts-clock"></use>
      </svg>
      <span class="contacts__hours">Sat – Sun: 10 AM – 4 PM</span>
    </li>
  </ul>
</div>
